name: NETRA Python Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend & Database CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netra_app_user
          POSTGRES_PASSWORD: netra_test_password
          POSTGRES_DB: netra_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Monorepo Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared/
          pip install -e backend/.[dev]

      - name: Run Ruff Linter
        run: |
          ruff check backend shared

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check backend shared

      - name: Run MyPy Type Checker
        run: |
          mypy backend/src shared/netra_shared

      - name: Validate Alembic Database Migrations
        env:
          NETRA_DATABASE_URL: postgresql+asyncpg://netra_app_user:netra_test_password@localhost:5432/netra_test_db
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run Pytest & Verify Coverage
        env:
          NETRA_DATABASE_URL: postgresql+asyncpg://netra_app_user:netra_test_password@localhost:5432/netra_test_db
        run: |
          pytest backend/tests -v --cov=netra_backend --cov-report=term-missing --cov-fail-under=80
