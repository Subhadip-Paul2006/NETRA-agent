[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-shared"
version = "0.1.0"
description = "NETRA Shared Domain Schemas, Enums & Utilities"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NETRA Core Security Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
